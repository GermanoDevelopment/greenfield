services:
  postgres:
    image: postgres:15-alpine
    container_name: greenfield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenfield
      POSTGRES_PASSWORD: greenfield
      POSTGRES_DB: greenfield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenfield -d greenfield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenfield-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://greenfield:greenfield@postgres:5432/greenfield
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production_min_32_chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/v1/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-false}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_PROGRAM_ID: ${SOLANA_PROGRAM_ID:-}
      USDC_MINT_DEVNET: ${USDC_MINT_DEVNET:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      ADMIN_GITHUB_USERNAMES: ${ADMIN_GITHUB_USERNAMES:-["GermanoDevelopment"]}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenfield-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
      VITE_SOLANA_RPC_URL: https://api.devnet.solana.com
      VITE_SOLANA_CHAIN: solana:devnet

volumes:
  postgres_data:
