services:
  postgres:
    image: postgres:15-alpine
    container_name: greenfield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenfield}
      POSTGRES_DB: ${POSTGRES_DB:-greenfield}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-greenfield} -d $${POSTGRES_DB:-greenfield}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenfield-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-greenfield}:${POSTGRES_PASSWORD:-greenfield}@postgres:5432/${POSTGRES_DB:-greenfield}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/v1/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_PROGRAM_ID: ${SOLANA_PROGRAM_ID:-}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]'
      ADMIN_GITHUB_USERNAMES: '["GermanoDevelopment"]'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_SOLANA_RPC_URL: ${VITE_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        VITE_SOLANA_CHAIN: ${VITE_SOLANA_CHAIN:-solana:devnet}
        VITE_SOLANA_PROGRAM_ID: ${SOLANA_PROGRAM_ID:-}
    container_name: greenfield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
