services:
  postgres:
    image: postgres:15-alpine
    container_name: greenfield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenfield
      POSTGRES_PASSWORD: greenfield
      POSTGRES_DB: greenfield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
