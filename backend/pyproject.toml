[project]
name = "greenfield-backend"
version = "0.1.0"
description = "Greenfield API - bounties for GitHub issues paid in USDC on Solana"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "base58>=2.1",
    "solders>=0.27.1",
    "mnemonic>=0.21",
    "requests>=2.31.0",
    "solinpy",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
solinpy = { git = "https://github.com/carcaras/solinpy.git", rev = "283c1eaab15821f5e1eb74b15b665cd166ee902b" }
