[package]
name = "greenfield"
version = "0.1.0"
description = "Greenfield Solana smart contract for instant open source bounty payouts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "greenfield"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
